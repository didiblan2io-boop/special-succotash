<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Магазин Приколов</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f3f4f6;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toast {
            transition: all 0.3s ease;
            transform: translateY(100%);
            opacity: 0;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        /* Анимация для использованного предмета */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: pop 0.3s ease-in-out;
        }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col items-center p-4 sm:p-8 bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100">

    <div id="toast" class="toast fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg z-50 flex items-center space-x-2 max-w-[90%] w-max">
        <i id="toast-icon" class="fas fa-info-circle"></i>
        <span id="toast-message" class="font-bold text-sm sm:text-base text-center">Уведомление</span>
    </div>

    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden relative">
        
        <div class="bg-gradient-to-r from-purple-500 to-pink-500 p-6 text-white text-center">
            <h1 class="text-2xl font-black tracking-wide"><i class="fas fa-store mr-2"></i>NFC Приколы</h1>
            <p class="text-sm opacity-80 mt-1">Твой карманный магазин</p>
        </div>

        <div id="screen-loading" class="screen p-8 text-center active">
            <i class="fas fa-spinner fa-spin text-4xl text-purple-500 mb-4"></i>
            <p class="text-lg font-bold">Загрузка...</p>
        </div>

        <div id="screen-scan" class="screen p-8 text-center">
            <div class="w-32 h-32 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-6 relative">
                <i class="fas fa-wifi text-5xl text-purple-600 animate-pulse" style="transform: rotate(90deg);"></i>
            </div>
            <h2 class="text-xl font-bold mb-2">Приложите NFC-карту</h2>
            <p class="text-gray-500 text-sm mb-6">Поднесите карту к телефону, чтобы открыть ваш кошелек и инвентарь.</p>
            
            <button id="btn-scan-nfc" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition duration-200 mb-4 flex items-center justify-center">
                <i class="fas fa-mobile-alt mr-2"></i> Читать NFC
            </button>
            
            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-gray-300"></div>
                <span class="flex-shrink-0 mx-4 text-gray-400 text-xs">или для теста</span>
                <div class="flex-grow border-t border-gray-300"></div>
            </div>

            <button id="btn-mock-nfc" class="w-full mt-2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center">
                <i class="fas fa-magic mr-2"></i> Симулировать NFC
            </button>
        </div>

        <div id="screen-store" class="screen bg-gray-50">
            <div class="bg-white p-5 shadow-sm border-b border-gray-100 flex justify-between items-center">
                <div>
                    <p class="text-xs text-gray-500 font-bold uppercase tracking-wider">Баланс</p>
                    <div class="flex items-center space-x-2">
                        <div class="flex items-baseline space-x-1">
                            <span id="ui-balance" class="text-3xl font-black text-gray-800">0</span>
                            <span class="text-lg font-bold text-purple-600">₽</span>
                        </div>
                        <button onclick="topUpBalance()" class="bg-green-100 hover:bg-green-200 text-green-700 w-8 h-8 rounded-full flex items-center justify-center transition transform active:scale-90" title="Пополнить">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>
                <div class="bg-purple-100 text-purple-800 px-3 py-1 rounded-lg text-sm font-bold flex items-center">
                    <i class="fas fa-id-card mr-2"></i>
                    <span id="ui-nfc-id" class="truncate max-w-[80px]">ID</span>
                </div>
            </div>

            <div class="p-6">
                <h3 class="text-lg font-bold mb-4 text-gray-800">Витрина</h3>
                <div id="shop-items" class="grid grid-cols-2 gap-4"></div>
            </div>

            <div class="p-6 bg-gray-100 border-t border-gray-200">
                <h3 class="text-lg font-bold mb-4 text-gray-800"><i class="fas fa-box-open mr-2 text-purple-500"></i>Ваши приколы</h3>
                <div id="inventory-list" class="space-y-3"></div>
            </div>

            <div class="p-4 bg-white text-center">
                <button id="btn-logout" class="text-red-500 font-bold hover:text-red-600 text-sm">
                    <i class="fas fa-sign-out-alt mr-1"></i> Достать другую карту
                </button>
            </div>
        </div>

    </div>

    <script>
        // Добавили поле actionText для каждого предмета
        const ITEMS = [
            { id: 'item_1', name: 'Котик', price: 200, icon: 'fa-cat', color: 'text-orange-500', bg: 'bg-orange-100', actionText: 'Мяу! Вы погладили котика 🐈' },
            { id: 'item_2', name: 'VIP Корона', price: 500, icon: 'fa-crown', color: 'text-yellow-500', bg: 'bg-yellow-100', actionText: 'Вы надели корону. Вы великолепны! 👑' },
            { id: 'item_3', name: 'Магия', price: 150, icon: 'fa-hat-wizard', color: 'text-purple-500', bg: 'bg-purple-100', actionText: 'ВЖУХ! Вы применили магию ✨' },
            { id: 'item_4', name: 'Усы', price: 50, icon: 'fa-user-secret', color: 'text-gray-800', bg: 'bg-gray-200', actionText: 'Вы приклеили усы. Вас не узнать! 🥸' },
        ];

        let currentWalletId = null;
        let currentWalletData = null;
        let toastTimeout = null;

        const screens = {
            loading: document.getElementById('screen-loading'),
            scan: document.getElementById('screen-scan'),
            store: document.getElementById('screen-store')
        };

        function showScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            screens[screenName].classList.add('active');
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            const icon = document.getElementById('toast-icon');
            
            toastMsg.textContent = message;
            
            if (type === 'error') {
                toast.classList.replace('bg-gray-800', 'bg-red-600');
                toast.classList.replace('bg-green-600', 'bg-red-600');
                toast.classList.replace('bg-purple-600', 'bg-red-600');
                icon.className = 'fas fa-exclamation-triangle';
            } else if (type === 'success') {
                toast.classList.replace('bg-gray-800', 'bg-green-600');
                toast.classList.replace('bg-red-600', 'bg-green-600');
                toast.classList.replace('bg-purple-600', 'bg-green-600');
                icon.className = 'fas fa-check-circle';
            } else if (type === 'action') {
                toast.classList.replace('bg-gray-800', 'bg-purple-600');
                toast.classList.replace('bg-red-600', 'bg-purple-600');
                toast.classList.replace('bg-green-600', 'bg-purple-600');
                icon.className = 'fas fa-star';
            } else {
                toast.className = 'toast fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg z-50 flex items-center space-x-2 max-w-[90%] w-max';
                icon.className = 'fas fa-info-circle';
            }

            toast.classList.add('show');
            
            if(toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    toast.className = 'toast fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg z-50 flex items-center space-x-2 max-w-[90%] w-max';
                }, 300);
            }, 3000);
        }

        function renderShop() {
            const container = document.getElementById('shop-items');
            container.innerHTML = '';
            ITEMS.forEach(item => {
                const btn = document.createElement('div');
                btn.className = `bg-white border-2 border-gray-100 rounded-2xl p-4 text-center cursor-pointer transform transition hover:scale-105 active:scale-95 shadow-sm hover:shadow-md`;
                btn.innerHTML = `
                    <div class="w-12 h-12 mx-auto rounded-full ${item.bg} flex items-center justify-center mb-3">
                        <i class="fas ${item.icon} text-2xl ${item.color}"></i>
                    </div>
                    <h4 class="font-bold text-sm leading-tight mb-2 h-8 flex items-center justify-center">${item.name}</h4>
                    <div class="inline-block bg-gray-100 rounded-lg px-3 py-1 font-black text-purple-600">${item.price} ₽</div>
                `;
                btn.onclick = () => buyItem(item);
                container.appendChild(btn);
            });
        }

        function updateWalletUI(data) {
            // Анимация изменения баланса
            const balanceEl = document.getElementById('ui-balance');
            balanceEl.classList.add('animate-pop');
            setTimeout(() => balanceEl.classList.remove('animate-pop'), 300);
            balanceEl.textContent = data.balance;

            const inventoryList = document.getElementById('inventory-list');
            inventoryList.innerHTML = '';

            if (!data.inventory || data.inventory.length === 0) {
                inventoryList.innerHTML = '<p class="text-sm text-gray-500 text-center py-4">Вы пока ничего не купили</p>';
                return;
            }

            const counts = {};
            data.inventory.forEach(id => { counts[id] = (counts[id] || 0) + 1; });

            Object.entries(counts).forEach(([itemId, count]) => {
                const itemDef = ITEMS.find(i => i.id === itemId);
                if (!itemDef) return;
                
                const itemEl = document.createElement('div');
                // Сделали предметы кликабельными
                itemEl.className = 'bg-white p-3 rounded-xl shadow-sm flex items-center justify-between border border-gray-200 cursor-pointer hover:bg-gray-50 transition transform active:scale-[0.98] select-none';
                itemEl.onclick = () => useItem(itemId);
                
                itemEl.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full ${itemDef.bg} flex items-center justify-center">
                            <i class="fas ${itemDef.icon} ${itemDef.color}"></i>
                        </div>
                        <div class="flex flex-col">
                            <span class="font-bold text-gray-800 leading-tight">${itemDef.name}</span>
                            <span class="text-[10px] text-gray-400 font-bold uppercase mt-0.5">Нажми, чтобы юзнуть</span>
                        </div>
                    </div>
                    <span class="bg-purple-100 text-purple-800 px-2 py-1 rounded-md text-xs font-bold">x${count}</span>
                `;
                inventoryList.appendChild(itemEl);
            });
        }

        function openWallet(nfcId) {
            currentWalletId = nfcId;
            document.getElementById('ui-nfc-id').textContent = nfcId.substring(0, 6) + '...';
            
            let savedData = localStorage.getItem('wallet_' + nfcId);
            if (savedData) {
                currentWalletData = JSON.parse(savedData);
                showToast('Данные карты успешно загружены', 'success');
            } else {
                currentWalletData = { balance: 1000, inventory: [] };
                localStorage.setItem('wallet_' + nfcId, JSON.stringify(currentWalletData));
                showToast('Новая карта! Вам начислено 1000₽', 'success');
            }

            updateWalletUI(currentWalletData);
            renderShop();
            showScreen('store');
        }

        function buyItem(item) {
            if (currentWalletData.balance < item.price) {
                showToast(`Недостаточно средств!`, 'error');
                return;
            }
            
            currentWalletData.balance -= item.price;
            currentWalletData.inventory.push(item.id);
            
            localStorage.setItem('wallet_' + currentWalletId, JSON.stringify(currentWalletData));
            updateWalletUI(currentWalletData);
            showToast(`Вы купили "${item.name}"!`, 'success');
        }

        // НОВАЯ ФУНКЦИЯ: Пополнение баланса
        function topUpBalance() {
            currentWalletData.balance += 500;
            localStorage.setItem('wallet_' + currentWalletId, JSON.stringify(currentWalletData));
            updateWalletUI(currentWalletData);
            showToast('+ 500₽ на ваш счет!', 'success');
        }

        // НОВАЯ ФУНКЦИЯ: Использование предмета
        function useItem(itemId) {
            const itemDef = ITEMS.find(i => i.id === itemId);
            if (!itemDef) return;

            // Ищем первый такой предмет в инвентаре и удаляем его (тратим)
            const index = currentWalletData.inventory.indexOf(itemId);
            if (index > -1) {
                currentWalletData.inventory.splice(index, 1);
                localStorage.setItem('wallet_' + currentWalletId, JSON.stringify(currentWalletData));
                
                updateWalletUI(currentWalletData);
                // Показываем смешной текст при использовании
                showToast(itemDef.actionText, 'action');
            }
        }

        async function startNfcScan() {
            if (!('NDEFReader' in window)) {
                showToast('NFC не поддерживается. Откройте в Chrome на Android.', 'error');
                return;
            }
            try {
                const ndef = new NDEFReader();
                await ndef.scan();
                showToast('Приложите карту к телефону...', 'info');
                ndef.onreading = event => {
                    if (event.serialNumber) {
                        openWallet(event.serialNumber);
                    } else {
                        showToast('Не удалось прочитать ID', 'error');
                    }
                };
            } catch (error) {
                showToast('Нет доступа к NFC', 'error');
            }
        }

        function simulateNfc() {
            const fakeIds = ["TEST-CARD-777", "TEST-CARD-888"];
            const randomId = fakeIds[Math.floor(Math.random() * fakeIds.length)];
            openWallet(randomId);
        }

        setTimeout(() => showScreen('scan'), 500);

        document.getElementById('btn-scan-nfc').addEventListener('click', startNfcScan);
        document.getElementById('btn-mock-nfc').addEventListener('click', simulateNfc);
        document.getElementById('btn-logout').addEventListener('click', () => {
            currentWalletId = null;
            currentWalletData = null;
            showScreen('scan');
        });
    </script>
</body>
</html>
